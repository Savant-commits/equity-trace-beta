<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Offline - Equity Trace</title>
<meta name="theme-color" content="#995dff">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;font-family:system-ui,-apple-system,sans-serif}
body{
  background:#020208;color:#eef2ff;
  display:flex;align-items:center;justify-content:center;
  text-align:center;padding:20px;
}
.offline-container{max-width:400px}
.offline-icon{
  width:80px;height:80px;margin:0 auto 24px;
  border-radius:50%;background:rgba(153,93,255,0.15);
  display:flex;align-items:center;justify-content:center;
}
.offline-icon svg{width:40px;height:40px;stroke:#995dff}
h1{font-size:24px;font-weight:600;margin-bottom:12px;color:#eef2ff}
p{font-size:16px;color:#b0bcd6;line-height:1.5;margin-bottom:24px}
button{
  background:#995dff;color:#fff;border:none;
  padding:12px 24px;border-radius:8px;font-size:15px;
  font-weight:500;cursor:pointer;transition:all .2s;
}
button:hover{background:#7d48d9;transform:translateY(-1px)}
button:active{transform:translateY(0)}
</style>
</head>
<body>
<div class="offline-container">
  <div class="offline-icon">
    <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <line x1="1" y1="1" x2="23" y2="23"></line>
      <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"></path>
      <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"></path>
      <path d="M10.71 5.05A16 16 0 0 1 22.58 9"></path>
      <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"></path>
      <path d="M8.53 16.11a6 6 0 0 1 6.95 0"></path>
      <circle cx="12" cy="20" r="1"></circle>
    </svg>
  </div>
  <h1>You're offline</h1>
  <p>It looks like you've lost your internet connection. Some features may not be available until you're back online.</p>
  <button onclick="location.reload()">Try Again</button>
</div>
</body>
</html>
